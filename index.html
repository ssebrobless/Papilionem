<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papilionem</title>
    
    <link rel="icon" type="image/png" href="preview.png" />
    <meta name="description" content="Papilionem is a painted butterfly-garden life sim with social behavior, breeding, hybrids, world travel, and audit-ready debug tools." />
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Papilionem" />
    <meta property="og:image" content="preview.png" />
    
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Papilionem" />
    <meta property="twitter:image" content="preview.png" />
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #app-shell {
            position: relative;
            display: inline-block;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        #shell-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: #f4f7fb;
        }
        #shell-overlay.is-hidden {
            display: none;
        }
        #shell-overlay .shell-panel {
            position: absolute;
            display: flex;
            flex-direction: column;
            min-height: 0;
            pointer-events: auto;
            border: 1px solid rgba(210, 228, 255, 0.42);
            border-radius: 12px;
            background: rgba(20, 24, 30, 0.92);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            overflow: hidden;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }
        #shell-overlay .shell-panel.is-high-contrast {
            background: rgba(0, 0, 0, 0.96);
            border-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
        }
        #shell-overlay .shell-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px 8px;
        }
        #shell-overlay .shell-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        #shell-overlay .shell-subtitle {
            font-size: 11px;
            color: rgba(225, 231, 240, 0.82);
        }
        #shell-overlay .shell-panel.is-high-contrast .shell-subtitle {
            color: rgba(255, 255, 255, 0.96);
        }
        #shell-overlay .shell-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        #shell-overlay .shell-chip {
            border: 1px solid rgba(210, 228, 255, 0.32);
            border-radius: 999px;
            background: rgba(36, 44, 56, 0.92);
            color: #f7fbff;
            font-size: 10px;
            line-height: 1;
            padding: 5px 9px;
        }
        #shell-overlay .shell-feed-list {
            display: flex;
            flex: 1 1 auto;
            min-height: 0;
            flex-direction: column;
            gap: 8px;
            padding: 0 10px 10px;
            max-height: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }
        #shell-overlay .shell-feed-entry {
            border-radius: 10px;
            border: 1px solid rgba(210, 228, 255, 0.18);
            background: rgba(16, 20, 28, 0.86);
            padding: 8px 10px;
        }
        #shell-overlay .shell-feed-entry[data-category="talk"] {
            border-color: rgba(124, 220, 172, 0.42);
        }
        #shell-overlay .shell-feed-entry[data-category="actions"] {
            border-color: rgba(117, 177, 255, 0.42);
        }
        #shell-overlay .shell-feed-entry[data-category="learn"] {
            border-color: rgba(236, 148, 194, 0.42);
        }
        #shell-overlay .shell-feed-headline {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        #shell-overlay .shell-feed-detail,
        #shell-overlay .shell-feed-footer,
        #shell-overlay .shell-empty {
            font-size: 11px;
            line-height: 1.35;
            color: rgba(229, 235, 243, 0.88);
        }
        #shell-overlay .shell-feed-heard-meaning {
            display: block;
            margin-top: 3px;
            color: rgba(229, 235, 243, 0.72);
            font-size: 11px;
            line-height: 1.25;
        }
        #shell-overlay .shell-feed-footer {
            margin-top: 5px;
            color: rgba(188, 198, 212, 0.88);
        }
        #shell-overlay .shell-action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 10px 10px;
        }
        #shell-overlay button.shell-button {
            appearance: none;
            border: 1px solid rgba(210, 228, 255, 0.28);
            border-radius: 9px;
            background: rgba(32, 38, 48, 0.92);
            color: #f5f8fc;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        #shell-overlay button.shell-button.is-active {
            background: rgba(90, 116, 164, 0.9);
        }
        #shell-overlay .shell-panel.is-high-contrast button.shell-button {
            border-color: rgba(255, 255, 255, 0.92);
            background: rgba(0, 0, 0, 0.96);
            color: #fff;
        }
        #shell-overlay .shell-panel.is-high-contrast button.shell-button.is-active {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
        }
        #shell-overlay .shell-access-list {
            display: grid;
            flex: 1 1 auto;
            min-height: 0;
            gap: 8px;
            padding: 0 10px 10px;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }
        #shell-overlay .shell-access-item {
            border-radius: 10px;
            border: 1px solid rgba(210, 228, 255, 0.18);
            background: rgba(16, 20, 28, 0.86);
            padding: 8px 10px;
        }
        #shell-overlay .shell-access-label {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        #shell-overlay .shell-slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px 12px;
        }
        #shell-overlay .shell-slider-row input[type="range"] {
            flex: 1;
        }
        #shell-overlay .shell-slider-value {
            font-size: 11px;
            min-width: 38px;
            text-align: right;
        }
        #shell-overlay .shell-body-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0 10px 10px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }
        #shell-overlay .shell-entry-list,
        #shell-overlay .shell-section-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #shell-overlay button.shell-entry-button {
            appearance: none;
            border: 1px solid rgba(210, 228, 255, 0.18);
            border-radius: 10px;
            background: rgba(16, 20, 28, 0.86);
            color: #f5f8fc;
            padding: 8px 10px;
            text-align: left;
            cursor: pointer;
        }
        #shell-overlay button.shell-entry-button.is-active {
            border-color: rgba(124, 220, 172, 0.54);
            background: rgba(28, 44, 36, 0.92);
        }
        #shell-overlay .shell-entry-title,
        #shell-overlay .shell-section-title,
        #shell-overlay .shell-footer-label {
            font-size: 11px;
            font-weight: 700;
        }
        #shell-overlay .shell-entry-detail,
        #shell-overlay .shell-section-line,
        #shell-overlay .shell-hero-line {
            font-size: 11px;
            line-height: 1.35;
            color: rgba(229, 235, 243, 0.88);
        }
        #shell-overlay .shell-hero-card,
        #shell-overlay .shell-section-card {
            border-radius: 10px;
            border: 1px solid rgba(210, 228, 255, 0.18);
            background: rgba(16, 20, 28, 0.86);
            padding: 8px 10px;
        }
        #shell-overlay .shell-hero-card {
            margin-bottom: 8px;
        }
        #shell-overlay .shell-section-title {
            margin-bottom: 5px;
        }
        #shell-overlay .shell-footer-row {
            padding: 0 10px 12px;
        }
        #shell-overlay .shell-debug-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            padding: 0 10px 10px;
        }
        #shell-overlay .shell-debug-grid button.shell-button[disabled] {
            opacity: 0.55;
            cursor: default;
        }
        #shell-overlay .shell-debug-status {
            padding-bottom: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
</head>
<body>
    <div id="app-shell">
        <div id="canvas-container"></div>
        <div id="shell-overlay" class="is-hidden" aria-live="polite"></div>
    </div>
    <!-- Core systems - must load first -->
    <script src="core/config.js"></script>
    <script src="core/trigCache.js"></script>
    <script src="core/butterflyStore.js"></script>
    <script src="core/progressionManager.js"></script>
    <script src="core/spriteManager.js"></script>
    <script src="core/entity.js"></script>
    <script src="core/gridManager.js"></script>
    <script src="core/isometricPhysics.js"></script>
    <script src="ui/textMeasureCache.js"></script>
    <script src="core/renderManager.js"></script>
    
    <!-- Game entities -->
    <script src="entities/butterfly.js"></script>
    <script src="entities/flower.js"></script>
    <script src="entities/caterpillar.js"></script>
    <script src="entities/block.js"></script>
    
<!-- System managers -->
<script src="systems/eventBus.js"></script>
<script src="workers/offloadHost.js"></script>
<script src="systems/zoneSystem.js"></script>
    <script src="systems/statusSystem.js"></script>
    <script src="systems/behaviorSystem.js"></script>
    <script src="systems/objectSystem.js"></script>
    <script src="systems/structureSystem.js"></script>
    <script src="systems/physicsSystem.js"></script>
    <script src="systems/sleepSystem.js"></script>
    <script src="systems/lifeSimSystem.js"></script>
    <script src="systems/statProfileSystem.js"></script>
    <script src="systems/mlInferenceSystem.js"></script>
    <script src="systems/rosterSystem.js"></script>
    <script src="systems/teachingSystem.js"></script>
    <script src="systems/communicationSystem.js"></script>
    <script src="systems/battleSystem.js"></script>
    <script src="systems/saveSystem.js"></script>
    <script src="systems/telemetrySystem.js"></script>
    <script src="systems/populationManager.js"></script>
    <script src="systems/interactionSystem.js"></script>
    <script src="systems/particleSystem.js"></script>
    <script src="systems/breedingSystem.js"></script>
    <script src="systems/specialEffects.js"></script>
    
    <!-- UI -->
    <script src="ui/dom/feedPanel.js"></script>
    <script src="ui/dom/inspectPanel.js"></script>
    <script src="ui/dom/accessPanel.js"></script>
    <script src="ui/dom/journalPanel.js"></script>
    <script src="ui/dom/debugPanel.js"></script>
    <script src="ui/dom/guidePanel.js"></script>
    <script src="ui/dom/shellOverlay.js"></script>
    <script src="ui/debugUI.js"></script>
    <script src="ui/butterflyCollection.js"></script>
    <script src="ui/gameUI.js"></script>
    
    <!-- Game core orchestrator - must load before sketch.js -->
    <script src="core/gameCore.js"></script>
    
    <!-- Main p5.js wrapper -->
    <script src="sketch.js"></script>
</body>
</html>
